<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Pathway - Daftar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  
  <!-- LEFT SIDE -->
  <div class="left">
    <div class="logo">
      <h2>Pathway</h2>
    </div>

    <h1>Daftar</h1>

    <form>
      <label>Nama Lengkap</label>
      <input type="text">

      <label>Email</label>
      <input type="email">

      <label>Kata Sandi</label>
      <input type="password">

      <label>Nomor Telepon</label>
      <div class="phone">
        <span>+62</span>
        <input type="text">
      </div>

      <label>Alamat Lengkap</label>
      <input type="text">

      <label>Jenis Kelamin</label>
      <div class="gender">
        <input type="radio" name="jk"> Pria
        <input type="radio" name="jk"> Wanita
      </div>

      <button type="submit">Daftar</button>
    </form>

    <p class="footer">2026 © Larp Monster</p>
  </div>

  <!-- RIGHT SIDE -->
  <div class="right"></div>

</div>

</body>
</html>
